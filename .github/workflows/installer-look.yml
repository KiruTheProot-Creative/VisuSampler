# Screenshots of the newest release's installer, to check how it looks. They are printed into the log as base64
# (lines starting "SHOT <name> <n>/<count> "), and kept as an artifact too. Run by hand.
name: installer look
on: workflow_dispatch
jobs:
  look:
    runs-on: windows-latest
    steps:
      - name: Screenshots
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $t = gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName'   # newest, prereleases too
          gh release download $t --repo "${{ github.repository }}" --pattern KiruCAS-Setup.exe --dir . --clobber
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); }
          "@
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process .\KiruCAS-Setup.exe -PassThru
          function Win { $w = Get-Process | Where-Object { $_.MainWindowTitle -like "Setup*" -and $_.MainWindowHandle -ne 0 } | Select-Object -First 1; return $w }
          function Shot($n) { Start-Sleep -Seconds 4; $w = Win; if (-not $w) { "no setup window for $n"; return }
            [W]::SetForegroundWindow($w.MainWindowHandle) | Out-Null; Start-Sleep -Milliseconds 500
            $r = New-Object W+R; [W]::GetWindowRect($w.MainWindowHandle, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($r.Rt - $r.L), ($r.B - $r.T); $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size); $bmp.Save("shots\$n.png"); $g.Dispose(); $bmp.Dispose()
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("shots\$n.png")); $k = [Math]::Ceiling($b.Length / 3000)
            for ($i = 0; $i -lt $k; $i++) { "SHOT $n $($i+1)/$k " + $b.Substring($i * 3000, [Math]::Min(3000, $b.Length - $i * 3000)) } }
          Shot "1-welcome"; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Shot "2-license"; [System.Windows.Forms.SendKeys]::SendWait("%a"); Start-Sleep -Milliseconds 400; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Shot "3-info"; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Shot "4-apps-folder"; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Shot "5-parts"; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Shot "6-vst3-folder"; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Shot "7-next"; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Shot "8-ready"
          Get-Process | Where-Object { $_.ProcessName -like "KiruCAS-Setup*" -or $_.MainWindowTitle -like "Setup*" } | Stop-Process -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: installer-screenshots, path: shots, if-no-files-found: ignore }
