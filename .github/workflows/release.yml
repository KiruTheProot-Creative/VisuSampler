name: release
# Builds the Windows downloads and puts them on a GitHub release. For now HyperSynth only (the focus): the Kiru CAS
# setup carrying HyperSynth, and its VST3 zip. VisuMaker, VisuPlayer and NodeFX are paused; the full version of this
# file (all four, their jobs and install checks) is in git history before this change, ready to bring back.
# Runs when a tag like v0.2.0 is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hypersynth:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebView2 package
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "${{ github.workspace }}/nuget"
      - name: Configure
        shell: bash
        run: cmake -S apps/plugin -B build -DCMAKE_BUILD_TYPE=Release -DVISU_BUILD_PLUGIN=ON -DVISU_BUILD_TESTS=OFF -DVISU_BUILD_ID="${GITHUB_SHA::7}" -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/nuget"
      - name: Build
        run: cmake --build build --config Release --target HyperSynth_VST3 HyperSynth_Standalone --parallel 4
      - name: "Package: the zip, and the parts for the setup"
        shell: pwsh
        run: |
          foreach ($P in "HyperSynth") {
            $vst = Get-ChildItem build -Recurse -Directory -Filter "$P.vst3" | Select-Object -First 1
            $exe = Get-ChildItem build -Recurse -Filter "$P.exe" | Where-Object { $_.FullName -match "Standalone" } | Select-Object -First 1
            if (-not $vst -or -not $exe) { throw "$P was not built" }
            New-Item -ItemType Directory -Force "out/$P", "parts/$P" | Out-Null
            Compress-Archive -Path $vst.FullName -DestinationPath "out/$P/$P-VST3-Windows.zip"
            Copy-Item $exe.FullName "parts/$P/$P.exe"
            Copy-Item $vst.FullName "parts/$P/$P.vst3" -Recurse
          }
          Get-ChildItem out, parts -Recurse -Depth 1
      - uses: actions/upload-artifact@v4
        with: { name: HyperSynth, path: out/HyperSynth }
      - uses: actions/upload-artifact@v4
        with: { name: HyperSynth-parts, path: parts/HyperSynth }
  installer:
    needs: [hypersynth]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "*-parts", path: dl/parts }
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is missing" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build KiruCAS-Setup.exe
        shell: pwsh
        run: |
          $b = "$env:GITHUB_SHA".Substring(0,7); $w = "$env:GITHUB_WORKSPACE"
          & $env:ISCC "/DVersion=0.0.1" "/DBuild=$b" "/DRoot=$w" "/DHyperSynthVst3Dir=$w\dl\parts\HyperSynth-parts\HyperSynth.vst3" "/DHyperSynthExe=$w\dl\parts\HyperSynth-parts\HyperSynth.exe" "/DOutDir=$w\out" apps\installer\KiruCAS.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem out
      - name: Install it, try it, uninstall it
        shell: pwsh
        run: |
          $p = Start-Process out\KiruCAS-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "setup exit code $($p.ExitCode)" }
          $app = "$env:ProgramFiles\Kiru CAS"; $hvst = "$env:CommonProgramFiles\VST3\HyperSynth.vst3"
          foreach ($f in "$app\HyperSynth\HyperSynth.exe", "$app\LICENSE.txt", $hvst) { if (-not (Test-Path $f)) { throw "missing after install: $f" } else { "installed: $f" } }
          if ((Get-ChildItem $hvst -Recurse -Filter *.vst3 -File).Count -lt 1) { throw "the HyperSynth VST3 bundle has no plugin binary" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          foreach ($f in "$app\HyperSynth\HyperSynth.exe", $hvst) { if (Test-Path $f) { throw "still there after uninstall: $f" } }
          "uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        with: { name: KiruCAS-Setup, path: out }
  publish:
    needs: [hypersynth, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: "{KiruCAS-Setup,HyperSynth}" }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="build-$(date -u +%Y%m%d-%H%M)";; esac
          cat > notes.md <<'MD'
          HyperSynth for Windows: the two-layer synthesizer of the Kiru Creative Audio Suite (Kiru CAS).

          - **KiruCAS-Setup.exe**: installs HyperSynth (VST3 plugin and standalone app). It updates an earlier Kiru CAS / VisuSampler install in place and leaves the other programs there as they are. Uninstall from Windows Settings; your presets stay.
          - **HyperSynth-VST3-Windows.zip**: only the plugin, for installing by hand: put `HyperSynth.vst3` into `C:\Program Files\Common Files\VST3`.

          Presets are `.hsyn` files in `Documents\VisuSampler\HyperSynth Presets`, and they are yours.
          HyperSynth is free software under the GNU GPL v3 (or later). For now these builds carry HyperSynth only; VisuMaker, VisuPlayer and NodeFX stay on their last release.
          The builds are not code-signed, so Windows SmartScreen may ask before the first start ("More info", then "Run anyway").
          MD
          gh release create "$TAG" dl/KiruCAS-Setup/* dl/HyperSynth/* --repo "$REPO" --target "${GITHUB_SHA}" --title "HyperSynth 0.0.1 (${TAG})" --notes-file notes.md --prerelease
