name: maker
# Paused while we focus on HyperSynth: runs only when started by hand (Actions tab). To bring it back, restore the
# push triggers from git history.
on:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: apps/maker-desktop
      - name: Build native audio (VisuMakerAudio)
        shell: bash
        run: |
          cmake -S apps/plugin -B nbuild -DCMAKE_BUILD_TYPE=Release -DVISU_BUILD_TESTS=OFF -DVISU_BUILD_MAKER_AUDIO=ON
          cmake --build nbuild --config Release --target VisuMakerAudio --parallel 4
          mkdir -p apps/maker-desktop/native
          find nbuild -name "VisuMakerAudio.exe" -exec cp {} apps/maker-desktop/native/ \;
          ls -la apps/maker-desktop/native
      - name: Engine self-check (old way, worklet loaded as a file; allowed to fail)
        continue-on-error: true
        shell: bash
        run: npm run copy && timeout 120 npx electron . --smoke --worklet-file
        working-directory: apps/maker-desktop
      - name: Engine self-check (the shared engine must run inside the desktop app)
        shell: bash
        run: npm run copy && timeout 120 npx electron . --smoke
        working-directory: apps/maker-desktop
      - name: Native audio self-check (VisuMakerAudio must start and load the project)
        shell: bash
        run: npm run copy && timeout 120 npx electron . --smoke --smoke-native
        working-directory: apps/maker-desktop
      - name: Build installer
        run: npm run dist
        working-directory: apps/maker-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: VisuMaker-${{ runner.os }}
          path: |
            apps/maker-desktop/dist/*.exe
            apps/maker-desktop/dist/*.dmg
            apps/maker-desktop/dist/*.AppImage
          if-no-files-found: error
