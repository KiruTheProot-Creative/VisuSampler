name: maker
on:
  push:
    paths:
      - "apps/maker/**"
      - "apps/maker-desktop/**"
      - "packages/core/**"
      - ".github/workflows/maker.yml"
  pull_request:
    paths:
      - "apps/maker/**"
      - "apps/maker-desktop/**"
      - "packages/core/**"
      - ".github/workflows/maker.yml"
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: apps/maker-desktop
      - name: Build installer
        run: npm run dist
        working-directory: apps/maker-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: VisuMaker-${{ runner.os }}
          path: |
            apps/maker-desktop/dist/*.exe
            apps/maker-desktop/dist/*.dmg
            apps/maker-desktop/dist/*.AppImage
          if-no-files-found: error
