name: plugin
on:
  push:
    paths:
      - "apps/plugin/**"
      - "apps/maker/nodefx.html"
      - "apps/maker/app.js"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "apps/plugin/**"
      - "apps/maker/nodefx.html"
      - "apps/maker/app.js"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for JUCE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: WebView2 package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "${{ github.workspace }}/nuget"
      - name: Configure
        shell: bash
        run: cmake -S apps/plugin -B build -DCMAKE_BUILD_TYPE=Release -DVISU_BUILD_PLUGIN=ON -DVISU_BUILD_TESTS=OFF -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/nuget"
      - name: Build
        run: cmake --build build --config Release --target VisuPlayer_VST3 VisuPlayer_Standalone NodeFX_VST3 NodeFX_Standalone --parallel 4
      - name: Collect VST3 and standalone
        shell: bash
        run: |
          mkdir -p out
          find build -name "*.vst3" -maxdepth 6 -exec cp -R {} out/ \;
          find build -path "*Standalone*" -name "VisuPlayer.exe" -exec cp {} out/ \;
          find build -path "*Standalone*" -name "NodeFX.exe" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: VisuPlayer-${{ runner.os }}
          path: out
