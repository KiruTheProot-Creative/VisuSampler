<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisuPlayer</title>
<link rel="stylesheet" href="ui.css">
</head><body data-mode="browse">
<header class="top">
  <button class="btn back" id="btnBack" type="button" hidden>&#9664; Libraries</button>
  <div class="logo">Visu<em>Player</em></div>
  <div class="title" id="curTitle"></div>
  <div class="insnav" id="insNav" hidden><button class="btn pnav" id="insPrev" type="button" aria-label="Previous instrument in this library">&#9664;</button><button class="btn pnav" id="insNext" type="button" aria-label="Next instrument in this library">&#9654;</button></div>
  <div class="grow"></div>
  <div class="presets" id="presetBox" hidden>
    <button class="btn pnav" id="prePrev" type="button" aria-label="Previous preset">&#9664;</button>
    <button class="btn" id="preBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="preName">Library default</span> &#9662;</button>
    <button class="btn pnav" id="preNext" type="button" aria-label="Next preset">&#9654;</button>
    <div class="pmenu" id="preMenu" role="menu" hidden></div>
  </div>
  <span class="muted" id="voices" hidden>0 voices</span>
  <button class="btn" id="btnAbout" type="button" aria-pressed="false" hidden>About</button>
  <button class="btn" id="btnFolder" type="button" title="Open the folder VisuPlayer reads libraries from">Library folder</button>
  <button class="btn community" id="btnCommunity" type="button" title="Join Kiru's Creative Suite (KCS) on Discord: help, news and libraries. Opens in your browser."><svg class="ico" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M3 2h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-3.5 2.8V12H3a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm1.5 4.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm3.5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm3.5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg>Discord</button>
  <button class="btn" id="btnAdd" type="button">Add library</button>
</header>
<section class="browse" id="browse" aria-label="Library browser">
  <div class="search"><span aria-hidden="true">&#9906;</span><input type="search" id="q" placeholder="Search libraries" aria-label="Search libraries"><button type="button" class="x" id="qClear" hidden aria-label="Clear search">&times;</button></div>
  <div class="ftabs" role="tablist"><button type="button" role="tab" data-ft="category" aria-selected="true">Category</button><button type="button" role="tab" data-ft="tags" aria-selected="false">Tags</button></div>
  <div class="chiprow" id="chips"></div>
  <div class="bmain"><div class="grid" id="grid"></div><aside class="bside" id="bside" hidden aria-label="Instruments of the library"></aside></div>
  <div class="emptybox" id="emptyBox" hidden><h1>No libraries yet</h1><p>Add a library (<b>.vslib</b>) or an instrument (<b>.vsins</b>), or put files in your library folder.</p><p class="muted" id="folderPath"></p><div><button class="btn" id="btnAdd2" type="button">Add library</button></div></div>
  <footer class="bfoot"><label class="vol">Volume <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label><span class="grow"></span><span id="count" class="muted"></span><button type="button" id="ver" class="ver muted" title="Version and build. Free software under the GNU GPL v3 (or later). Click to open the log folder (for bug reports)"></button></footer>
</section>
<section class="play" id="play" aria-label="Play" hidden>
  <div class="stage" id="stage"><iframe id="uiFrame" title="Instrument" hidden></iframe><div id="detail"></div></div>
  <footer class="keys" id="keysBar">
    <div class="kbar"><label>Volume <input type="range" id="vol2" min="0" max="1" step="0.01" value="0.8"></label><span class="muted" id="oct">Octave C2</span><span class="grow"></span><button class="btn" id="btnPanic" type="button">Panic</button></div>
    <div class="krow"><div class="wheels" id="wheels" role="group" aria-label="Pitch and mod wheels"></div><div class="piano" id="piano" aria-label="Piano keyboard"></div></div>
  </footer>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="ui.js"></script>
</body></html>
